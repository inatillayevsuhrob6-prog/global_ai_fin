{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px]"></div>
    
    <div class="glass-effect border border-white/10 rounded-3xl p-8 w-full max-w-md relative z-10 shadow-2xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-600 to-violet-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
                <i data-lucide="wallet" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Tizimga kirish</h1>
            <p class="text-gray-400 text-sm mt-2">Moliyangizni boshqarish uchun kiring</p>
        </div>
        
        <!-- Error Message -->
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center transition-all duration-300"></div>
        
        <!-- Form -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Foydalanuvchi nomi</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="text" id="username" required 
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors placeholder-gray-600"
                           placeholder="Username">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Parol</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="password" id="password" required 
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-12 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors placeholder-gray-600"
                           placeholder="••••••••">
                    
                    <!-- Toggle Password Visibility Button -->
                    <button type="button" id="toggle-password" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors focus:outline-none">
                        <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" 
                    class="w-full py-3 bg-gradient-to-r from-blue-600 to-violet-600 rounded-xl text-white font-semibold shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 transition-all flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed">
                <span>Kirish</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        
        <!-- Footer Links -->
        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Hisobingiz yo'qmi? 
                <a href="/register" class="text-blue-400 hover:text-blue-300 font-medium">Ro'yxatdan o'ting</a>
            </p>
            <a href="/" class="inline-block mt-4 text-gray-500 hover:text-gray-300 text-sm">
                ← Bosh sahifaga qaytish
            </a>
        </div>
    </div>
</div>

<script>
    // --- PASSWORD TOGGLE LOGIC ---
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if(toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            // Change icon
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });
    }

    // --- LOGIN FORM LOGIC ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Reset error
        errorMsg.classList.add('hidden');
        
        // Loading state
        btn.disabled = true;
        const originalBtnContent = btn.innerHTML;
        btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
        
        try {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                body: formData
            });
            
            // Safe JSON parsing
            let data;
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                data = await response.json();
            } else {
                throw new Error("Server xatosi. Iltimos, qayta urinib ko'ring.");
            }
            
            if (!response.ok) {
                throw new Error(data.detail || 'Login failed');
            }
            
            // Save token
            localStorage.setItem('access_token', data.access_token);
            
            // Redirect to dashboard
            window.location.href = '/dashboard';
            
        } catch (error) {
            errorMsg.textContent = error.message;
            errorMsg.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = originalBtnContent;
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
