{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute top-0 right-1/4 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
    
    <div class="glass-effect border border-white/10 rounded-3xl p-8 w-full max-w-md relative z-10 shadow-2xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto bg-gradient-to-br from-violet-600 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-violet-500/30 mb-4">
                <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Ro'yxatdan o'tish</h1>
            <p class="text-gray-400 text-sm mt-2">Yangi hisob yarating va boshlang</p>
        </div>
        
        <!-- Error/Success Message -->
        <div id="msg-box" class="hidden mb-4 p-3 rounded-xl text-sm text-center transition-all duration-300"></div>
        
        <!-- Form -->
        <form id="register-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">To'liq ism</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="text" id="full_name" 
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-violet-500 transition-colors placeholder-gray-600"
                           placeholder="Ism Familiya">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Foydalanuvchi nomi</label>
                <div class="relative">
                    <i data-lucide="at-sign" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="text" id="username" required minlength="3"
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-violet-500 transition-colors placeholder-gray-600"
                           placeholder="username">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="email" id="email" required 
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-violet-500 transition-colors placeholder-gray-600"
                           placeholder="example@mail.com">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Parol</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                    <input type="password" id="password" required minlength="6" maxlength="72"
                           class="w-full bg-black/30 border border-white/10 rounded-xl pl-10 pr-12 py-3 text-white focus:outline-none focus:border-violet-500 transition-colors placeholder-gray-600"
                           placeholder="6-72 ta belgi">
                    
                    <!-- Toggle Password Visibility Button -->
                    <button type="button" id="toggle-password" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors focus:outline-none">
                        <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">Maksimal 72 ta belgi</p>
            </div>
            
            <button type="submit" id="submit-btn" 
                    class="w-full py-3 bg-gradient-to-r from-violet-600 to-blue-600 rounded-xl text-white font-semibold shadow-lg shadow-violet-500/25 hover:shadow-violet-500/40 hover:-translate-y-0.5 transition-all flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed">
                <span>Ro'yxatdan o'tish</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        
        <!-- Footer Links -->
        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Hisobingiz bormi? 
                <a href="/login" class="text-violet-400 hover:text-violet-300 font-medium">Tizimga kiring</a>
            </p>
            <a href="/" class="inline-block mt-4 text-gray-500 hover:text-gray-300 text-sm">
                ← Bosh sahifaga qaytish
            </a>
        </div>
    </div>
</div>

<script>
    // --- PASSWORD TOGGLE LOGIC ---
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        
        // Change icon
        eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
        lucide.createIcons();
    });

    // --- FORM SUBMISSION LOGIC ---
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const msgBox = document.getElementById('msg-box');
        
        const full_name = document.getElementById('full_name').value || null;
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        // Reset msg
        msgBox.className = 'hidden mb-4 p-3 rounded-xl text-sm text-center transition-all duration-300';
        msgBox.textContent = '';
        
        // Loading state
        btn.disabled = true;
        const originalBtnContent = btn.innerHTML;
        btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
        
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ full_name, username, email, password })
            });
            
            // Safe JSON parsing
            let result;
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                result = await response.json();
            } else {
                throw new Error("Serverdan noto'g'ri javob olindi. Iltimos, qayta urinib ko'ring.");
            }
            
            if (!response.ok) {
                let errorMsg = result.detail || 'Ro\'yxatdan o\'tishda xatolik yuz berdi';
                if (Array.isArray(result.detail)) {
                    errorMsg = result.detail.map(d => d.msg).join(', ');
                }
                throw new Error(errorMsg);
            }
            
            // Success
            msgBox.className = 'mb-4 p-3 bg-green-500/10 border border-green-500/30 rounded-xl text-green-400 text-sm text-center transition-all duration-300';
            msgBox.textContent = 'Muvaffaqiyatli ro\'yxatdan o\'tdingiz! Tizimga yo\'naltirilmoqda...';
            msgBox.classList.remove('hidden');
            
            // Auto redirect to login after 1.5s
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
            
        } catch (error) {
            msgBox.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center transition-all duration-300';
            msgBox.textContent = error.message;
            msgBox.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = originalBtnContent;
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
