<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fc">
    <title>{{ title }} - GLOBAL AI FIN</title>
    <script>
        (() => {
            const saved = localStorage.getItem("global-ai-fin-theme-v2");
            document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { font-family: Inter, sans-serif; background: #071226; }
        body { transition: background-color .25s ease, color .25s ease; }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #0b1020; }
        ::-webkit-scrollbar-thumb { background: #26324c; border-radius: 9px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d4e70; }
        .glass-panel { background: rgba(15, 23, 42, .72); backdrop-filter: blur(18px); border: 1px solid rgba(148, 163, 184, .12); }
        .sidebar { background: rgba(10, 15, 30, .94); }
        .nav-item { position: relative; transition: color .2s ease, background .2s ease, transform .2s ease; }
        .nav-item:hover { transform: translateX(3px); }
        .nav-item.active { color: #bfdbfe; background: linear-gradient(90deg, rgba(37, 99, 235, .28), rgba(6, 182, 212, .07)); }
        .nav-item.active::before { content: ""; position: absolute; inset: 8px auto 8px 0; width: 3px; border-radius: 3px; background: linear-gradient(#3b82f6, #22d3ee); }
        .ambient { animation: ambient-drift 18s ease-in-out infinite alternate; }
        .ambient-two { animation: ambient-drift 23s ease-in-out infinite alternate-reverse; }
        .page-enter { animation: page-enter .45s cubic-bezier(.2,.75,.25,1) both; }
        .stat-card { animation: card-enter .65s cubic-bezier(.2,.75,.25,1) both; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
        .stat-card:nth-child(2) { animation-delay: .08s; }
        .stat-card:nth-child(3) { animation-delay: .16s; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 18px 50px rgba(0, 0, 0, .24); }
        .action-button { transition: transform .2s ease, filter .2s ease, box-shadow .2s ease; }
        .action-button:hover { transform: translateY(-2px); filter: brightness(1.12); box-shadow: 0 10px 28px rgba(99, 102, 241, .24); }
        .action-button:active { transform: translateY(0) scale(.98); }
        .loading-shimmer { background: linear-gradient(100deg, rgba(148,163,184,.04) 20%, rgba(148,163,184,.13) 40%, rgba(148,163,184,.04) 60%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
        html[data-theme="light"] body { background: #f5f7fc; color: #172033; }
        html[data-theme="light"] .glass-panel { background: rgba(255,255,255,.94); border-color: #dce7f7; box-shadow: 0 12px 35px rgba(37,99,235,.06); backdrop-filter: blur(16px); }
        html[data-theme="light"] .sidebar { background: rgba(255,255,255,.98); border-color: #dce7f7; }
        html[data-theme="light"] header.glass-panel { background: rgba(255,255,255,.94); border-bottom-color: #dce7f7; }
        html[data-theme="light"] ::-webkit-scrollbar-track { background: #edf4ff; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #b8ccef; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #8eaddd; }
        html[data-theme="light"] .nav-item.active { color: #1d4ed8; background: linear-gradient(90deg, #e8f1ff, #f2f8ff); }
        html[data-theme="light"] .nav-item:not(.active):hover { background: #f3f7ff; }
        html[data-theme="light"] .action-button[class*="bg-gradient-to-"] { color: #fff !important; }
        html[data-theme="light"] .bg-slate-950 { background-color: #f5f7fc !important; }
        html[data-theme="light"] [class~="bg-slate-950/70"] { background-color: #f8faff !important; }
        html[data-theme="light"] [class~="bg-slate-950/60"] { background-color: #f1f5fb !important; }
        html[data-theme="light"] [class~="bg-white/[.025]"],
        html[data-theme="light"] [class~="bg-white/[.03]"] { background-color: #f6f8fc !important; }
        html[data-theme="light"] [class~="bg-white/[.035]"]:hover { background-color: #f0f4fb !important; }
        html[data-theme="light"] [class~="border-white/10"],
        html[data-theme="light"] [class~="border-white/[.07]"],
        html[data-theme="light"] [class~="border-white/[.06]"],
        html[data-theme="light"] [class~="border-white/[.05]"] { border-color: #e3e8f1 !important; }
        html[data-theme="light"] [class~="divide-white/[.06]"] > :not([hidden]) ~ :not([hidden]),
        html[data-theme="light"] [class~="divide-white/[.07]"] > :not([hidden]) ~ :not([hidden]) { border-color: #e7ebf3 !important; }
        html[data-theme="light"] .text-white { color: #172033 !important; }
        html[data-theme="light"] .text-slate-200,
        html[data-theme="light"] .text-slate-300 { color: #354158 !important; }
        html[data-theme="light"] .text-slate-400 { color: #64718a !important; }
        html[data-theme="light"] .text-slate-500 { color: #78849a !important; }
        html[data-theme="light"] .text-slate-600 { color: #8792a6 !important; }
        html[data-theme="light"] .text-gray-400 { color: #64718a !important; }
        html[data-theme="light"] .text-gray-500 { color: #78849a !important; }
        html[data-theme="light"] .text-gray-300 { color: #354158 !important; }
        html[data-theme="light"] .text-blue-200,
        html[data-theme="light"] .text-blue-300,
        html[data-theme="light"] .text-cyan-200,
        html[data-theme="light"] .text-cyan-300 { color: #1d4ed8 !important; }
        html[data-theme="light"] .text-violet-200,
        html[data-theme="light"] .text-violet-300 { color: #4338ca !important; }
        html[data-theme="light"] .text-emerald-200,
        html[data-theme="light"] .text-emerald-300 { color: #047857 !important; }
        html[data-theme="light"] .text-rose-200,
        html[data-theme="light"] .text-rose-300 { color: #be123c !important; }
        html[data-theme="light"] .text-pink-200,
        html[data-theme="light"] .text-pink-300 { color: #be185d !important; }
        html[data-theme="light"] .placeholder\:text-slate-500::placeholder { color: #8792a6 !important; }
        html[data-theme="light"] input,
        html[data-theme="light"] textarea,
        html[data-theme="light"] select { color-scheme: light; }
        html[data-theme="light"] input::placeholder,
        html[data-theme="light"] textarea::placeholder { color: #98a2b3; }
        html[data-theme="light"] .ambient { opacity: .42; }
        html[data-theme="light"] #sidebar-backdrop { background-color: rgba(30,41,59,.25); }
        html[data-theme="light"] #toast { background-color: rgba(255,255,255,.97); box-shadow: 0 12px 35px rgba(26,39,68,.12); }
        html[data-theme="light"] .loading-shimmer { background: linear-gradient(100deg, rgba(148,163,184,.06) 20%, rgba(148,163,184,.19) 40%, rgba(148,163,184,.06) 60%); background-size: 200% 100%; }
        html[data-theme="dark"] body { background: #071226; color: #fff; }
        html[data-theme="dark"] .glass-panel { border-color: rgba(96, 165, 250, .13); }
        html[data-theme="dark"] .sidebar { background: rgba(5, 13, 29, .97); }
        html[data-theme="dark"] header.glass-panel { background: rgba(8, 18, 38, .9); }
        html[data-theme="dark"] .ambient { opacity: .72; }
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="light"] { color-scheme: light; }
        @keyframes page-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes card-enter { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes ambient-drift { from { transform: translate3d(-2%, -1%, 0) scale(.96); } to { transform: translate3d(3%, 2%, 0) scale(1.08); } }
        @keyframes shimmer { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden text-white selection:bg-violet-500/40">
    <div class="pointer-events-none fixed -left-24 -top-32 z-0 h-96 w-96 rounded-full bg-blue-600/20 blur-[120px] ambient"></div>
    <div class="pointer-events-none fixed -bottom-40 right-0 z-0 h-[30rem] w-[30rem] rounded-full bg-cyan-500/10 blur-[140px] ambient-two"></div>

    <div class="relative z-10 flex h-screen">
        <div id="sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/70 backdrop-blur-sm md:hidden"></div>
        <aside id="dashboard-sidebar" class="sidebar fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/[.07] transition-transform duration-300 md:static md:translate-x-0">
            <div class="flex h-20 shrink-0 items-center border-b border-white/[.07] px-6">
                <div class="mr-3 flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 shadow-lg shadow-blue-900/40">
                    <i data-lucide="wallet" class="h-5 w-5"></i>
                </div>
                <span class="font-bold tracking-tight">GLOBAL AI FIN</span>
                <button id="mobile-close" class="ml-auto rounded-lg p-2 text-slate-400 hover:bg-white/10 md:hidden" aria-label="Menyuni yopish"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>

            <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-6" aria-label="Asosiy menyu">
                <button data-page="overview" class="nav-item active flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="layout-dashboard" class="mr-3 h-5 w-5"></i>Bosh sahifa
                </button>
                <button data-page="transactions" class="nav-item flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="arrow-left-right" class="mr-3 h-5 w-5"></i>Operatsiyalar
                </button>
                <button data-page="budgets" class="nav-item flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="chart-pie" class="mr-3 h-5 w-5"></i>Byudjet
                </button>
                <button data-page="goals" class="nav-item flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="target" class="mr-3 h-5 w-5"></i>Maqsadlar
                </button>
                <button data-page="assistant" class="nav-item flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="bot" class="mr-3 h-5 w-5"></i>AI yordamchi
                </button>
                <button data-page="premium" class="nav-item flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-400">
                    <i data-lucide="sparkles" class="mr-3 h-5 w-5"></i>AI moliya laboratoriyasi
                </button>
            </nav>

            <div class="border-t border-white/[.07] p-4">
                <button id="logout-button" class="flex w-full items-center rounded-xl px-4 py-3 text-sm font-medium text-rose-300 transition hover:bg-rose-500/10 hover:text-rose-200">
                    <i data-lucide="log-out" class="mr-3 h-5 w-5"></i>Chiqish
                </button>
            </div>
        </aside>

        <div class="flex min-w-0 flex-1 flex-col">
            <header class="glass-panel z-20 flex h-20 shrink-0 items-center justify-between border-x-0 border-t-0 px-4 sm:px-6">
                <div class="flex items-center gap-3">
                    <button id="mobile-menu-toggle" class="rounded-xl border border-white/10 p-2.5 text-slate-300 hover:bg-white/5 md:hidden" aria-label="Menyuni ochish"><i data-lucide="menu" class="h-5 w-5"></i></button>
                    <div class="hidden text-sm text-slate-400 sm:block">Shaxsiy moliya boshqaruvi</div>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" data-theme-toggle class="theme-toggle flex items-center gap-2 rounded-xl border border-white/10 bg-white/[.03] px-3 py-2.5 text-xs font-semibold text-slate-300 transition hover:bg-white/[.08]" aria-label="Rang mavzusini almashtirish">
                        <i data-lucide="moon" data-theme-icon class="h-4 w-4"></i><span data-theme-label class="hidden sm:inline">Qorong'i</span>
                    </button>
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-semibold text-white">Yuklanmoqda...</p>
                        <p class="text-xs text-slate-500">Foydalanuvchi</p>
                    </div>
                    <div class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-gradient-to-br from-violet-500 to-blue-500 shadow-lg shadow-violet-900/30">
                        <i data-lucide="user-round" class="h-5 w-5"></i>
                    </div>
                </div>
            </header>
            <main class="relative flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-5 right-5 z-50 translate-y-4 rounded-xl border border-white/10 bg-slate-900/95 px-4 py-3 text-sm text-white opacity-0 shadow-2xl transition-all duration-300"></div>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
